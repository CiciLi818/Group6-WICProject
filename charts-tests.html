<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chart tests</title><link rel="stylesheet" href="css/styles.css"><script src="js/charts.js"></script><script src="js/charts.test.js"></script></head><body><main><h1>Chart tests</h1><p>Pure calculations only. These tests do not read or change saved records.</p><p id="summary" role="status"></p><ul id="results"></ul><script>const results=runChartTests();document.querySelector('#summary').textContent=results.filter(r=>r.pass).length+' / '+results.length+' passed';results.forEach(r=>{const li=document.createElement('li');li.textContent=(r.pass?'PASS: ':'FAIL: ')+r.name+(r.error?' — '+r.error:'');document.querySelector('#results').append(li);});</script></main></body></html>
